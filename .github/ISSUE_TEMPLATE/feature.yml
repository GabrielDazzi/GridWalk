name: Feature idea
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should Grid Walk do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Who benefits and how?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is not a widget / Live Activity / WeatherKit request for before v1 polish is done
          required: false
