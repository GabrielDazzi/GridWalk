name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit-tests:
    name: GridWalkKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: swift test
        working-directory: GridWalkKit
        run: swift test

  build-macos:
    name: Build macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: xcodebuild
        run: |
          xcodebuild \
            -scheme "Grid Walk" \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  build-ios:
    name: Build iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: xcodebuild
        run: |
          xcodebuild \
            -scheme "Grid Walk" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
